spring.application.name=dashboard-service

server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/finance_tracker
spring.datasource.username=finance_user
spring.datasource.password=finance_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.schemas=dashboard
spring.flyway.baseline-on-migrate=true

# Service URLs
transaction.service.url=http://localhost:8082
budget.service.url=http://localhost:8083
debt.service.url=http://localhost:8084

spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
