spring.application.name=chatbot-service

server.port=8087

# Downstream service URLs (used only when the user grants finance-data access)
services.transaction.url=${TRANSACTION_SERVICE_URL:http://localhost:8082}
services.budget.url=${BUDGET_SERVICE_URL:http://localhost:8083}
services.debt.url=${DEBT_SERVICE_URL:http://localhost:8084}
services.dashboard.url=${DASHBOARD_SERVICE_URL:http://localhost:8085}
services.accounts.url=${ACCOUNTS_SERVICE_URL:http://localhost:8086}

# LLM provider auto-detection (checked in this order):
#   1. OPENAI_API_KEY      -> OpenAI  (model: OPENAI_MODEL, default gpt-4o-mini)
#   2. ANTHROPIC_API_KEY   -> Anthropic (model: ANTHROPIC_MODEL, default claude-3-5-haiku-20241022)
#   3. GEMINI_API_KEY      -> Google Gemini (model: GEMINI_MODEL, default gemini-2.0-flash)
#   4. OPENAI_BASE_URL + OPENAI_API_KEY -> any OpenAI-compatible endpoint
chatbot.openai.api-key=${OPENAI_API_KEY:}
chatbot.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
chatbot.openai.model=${OPENAI_MODEL:gpt-4o-mini}
chatbot.anthropic.api-key=${ANTHROPIC_API_KEY:}
chatbot.anthropic.model=${ANTHROPIC_MODEL:claude-3-5-haiku-20241022}
chatbot.gemini.api-key=${GEMINI_API_KEY:}
chatbot.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
