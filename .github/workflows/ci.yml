name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript types
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --run --coverage

      - name: Build production frontend
        run: npm run build

  backend:
    name: ${{ matrix.service.name }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: Auth Service
            path: services/auth-service
          - name: Transaction Service
            path: services/transaction-service
          - name: Budget Service
            path: services/budget-service
          - name: Debt Service
            path: services/debt-service
          - name: Accounts Service
            path: services/accounts-service
          - name: Dashboard Service
            path: services/dashboard-service
          - name: Chatbot Service
            path: services/chatbot-service
          - name: API Gateway
            path: infrastructure/gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve Maven dependencies
        working-directory: ${{ matrix.service.path }}
        run: mvn -B dependency:go-offline

      - name: Run unit tests
        working-directory: ${{ matrix.service.path }}
        run: mvn -B test -Dtest='!*IntegrationTest'

      - name: Compile and package
        working-directory: ${{ matrix.service.path }}
        run: mvn -B package -DskipTests

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service.path }}-test-reports
          path: ${{ matrix.service.path }}/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

  backend-integration-tests:
    name: Backend integration tests
    runs-on: ubuntu-latest
    needs: [backend]
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: Auth Service
            path: services/auth-service
          - name: Transaction Service
            path: services/transaction-service
          - name: Budget Service
            path: services/budget-service
          - name: Debt Service
            path: services/debt-service
          - name: Accounts Service
            path: services/accounts-service
          - name: Dashboard Service
            path: services/dashboard-service
          - name: Chatbot Service
            path: services/chatbot-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run integration tests with Testcontainers
        working-directory: ${{ matrix.service.path }}
        run: mvn -B test -Dtest=*IntegrationTest

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service.path }}-integration-test-reports
          path: ${{ matrix.service.path }}/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

  e2e-tests:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
