name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Frontend: Lint and build
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Build frontend
        run: npm run build

  # Backend: Compile, test, and build all services
  backend:
    name: Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile all services
        run: |
          cd services/auth-service && mvn clean compile
          cd ../transaction-service && mvn clean compile
          cd ../budget-service && mvn clean compile
          cd ../debt-service && mvn clean compile
          cd ../dashboard-service && mvn clean compile
          cd ../../infrastructure/gateway && mvn clean compile

      - name: Run unit tests
        run: |
          cd services/auth-service && mvn test
          cd ../transaction-service && mvn test
          cd ../budget-service && mvn test
          cd ../debt-service && mvn test
          cd ../dashboard-service && mvn test
          cd ../../infrastructure/gateway && mvn test

      - name: Build JARs
        run: |
          cd services/auth-service && mvn clean package -DskipTests
          cd ../transaction-service && mvn clean package -DskipTests
          cd ../budget-service && mvn clean package -DskipTests
          cd ../debt-service && mvn clean package -DskipTests
          cd ../dashboard-service && mvn clean package -DskipTests
          cd ../../infrastructure/gateway && mvn clean package -DskipTests
