version: '3.8'

services:
  auth-service:
    build: ../services/auth-service
    container_name: auth-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_DATASOURCE_URL: ${APP_DB_URL:?Set APP_DB_URL in .env}
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USERNAME:?Set APP_DB_USERNAME in .env}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    restart: on-failure

  transaction-service:
    build: ../services/transaction-service
    container_name: transaction-service
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SPRING_DATASOURCE_URL: ${APP_DB_URL:?Set APP_DB_URL in .env}
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USERNAME:?Set APP_DB_USERNAME in .env}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    restart: on-failure

  budget-service:
    build: ../services/budget-service
    container_name: budget-service
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      SPRING_DATASOURCE_URL: ${APP_DB_URL:?Set APP_DB_URL in .env}
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USERNAME:?Set APP_DB_USERNAME in .env}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    restart: on-failure

  debt-service:
    build: ../services/debt-service
    container_name: debt-service
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      SPRING_DATASOURCE_URL: ${APP_DB_URL:?Set APP_DB_URL in .env}
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USERNAME:?Set APP_DB_USERNAME in .env}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    restart: on-failure

  dashboard-service:
    build: ../services/dashboard-service
    container_name: dashboard-service
    ports:
      - "127.0.0.1:8085:8085"
    depends_on:
      transaction-service:
        condition: service_started
      budget-service:
        condition: service_started
      debt-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: ${APP_DB_URL:?Set APP_DB_URL in .env}
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USERNAME:?Set APP_DB_USERNAME in .env}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      TRANSACTION.SERVICE.URL: http://transaction-service:8082
      BUDGET.SERVICE.URL: http://budget-service:8083
      DEBT.SERVICE.URL: http://debt-service:8084
    restart: on-failure

  api-gateway:
    build: .
    container_name: api-gateway
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - auth-service
      - transaction-service
      - budget-service
      - debt-service
      - dashboard-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    restart: on-failure
