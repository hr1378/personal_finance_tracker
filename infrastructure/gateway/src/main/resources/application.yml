spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Routes are defined in GatewayConfig.java where the JWT filter is applied.
      # Do NOT add unauthenticated routes here.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173,http://localhost:5174,http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

server:
  port: 8080

# JWT Configuration (must match auth-service)
jwt:
  secret: ${JWT_SECRET}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
